name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium

      # Both suites always run; the job goes red at the end if either failed.
      - name: smoke
        id: smoke
        continue-on-error: true
        run: npm run smoke -- --forbid-only

      - name: regression
        id: regression
        continue-on-error: true
        run: npm run regression -- --forbid-only

      - name: build allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/allure-report/
            e2e/allure-results/
          retention-days: 14

      - name: fail if smoke or regression failed
        if: ${{ steps.smoke.outcome == 'failure' || steps.regression.outcome == 'failure' }}
        run: exit 1

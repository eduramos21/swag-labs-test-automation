name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: ${{ matrix.suite }} ${{ matrix.user }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One build per suite and user. problem_user jobs stay red on purpose (seeded app bugs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: smoke, user: standard_user }
          - { suite: smoke, user: problem_user }
          - { suite: smoke, user: locked_out_user }
          - { suite: regression, user: standard_user }
          - { suite: regression, user: problem_user }
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium

      - name: every test has one user tag
        run: npm run check:tags

      - name: ${{ matrix.suite }} ${{ matrix.user }}
        run: npm run ${{ matrix.suite }} ${{ matrix.user }} -- --forbid-only

      - name: build allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-${{ matrix.suite }}-${{ matrix.user }}
          path: |
            e2e/test-results/
            e2e/allure-report/
            e2e/allure-results/
          retention-days: 14
